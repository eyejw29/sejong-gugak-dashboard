<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#FAFAFA;--white:#FFF;--border:#E5E7EB;--border-light:#F3F4F6;
  --text:#111827;--text-2:#6B7280;--text-3:#9CA3AF;
  --blue:#2563EB;--blue-light:#EFF6FF;--blue-bg:#DBEAFE;
  --red:#EF4444;--red-light:#FEE2E2;
  --orange:#F59E0B;--orange-light:#FEF3C7;
  --green:#10B981;--green-light:#ECFDF5;
  --purple:#8B5CF6;--purple-light:#F3E8FF;
  --radius:8px;
}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;}

/* ===== HEADER ===== */
.header{background:var(--white);border-bottom:1px solid var(--border);padding:20px 28px;position:sticky;top:0;z-index:100;}
.header-row{display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:17px;font-weight:700;color:var(--text);}
.header-stats{font-size:13px;color:var(--text-2);margin-top:4px;}
.header-stats strong{color:var(--text);font-weight:600;}
.header-right{text-align:right;}
.header-date{font-size:12px;color:var(--text-3);}

/* ===== TABS ===== */
.tabs{display:flex;background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;gap:4px;}
.tab{padding:12px 18px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;user-select:none;}
.tab:hover{color:var(--blue);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}

/* ===== TOOLBAR ===== */
.toolbar{display:flex;align-items:center;gap:12px;padding:16px 28px;flex-wrap:wrap;}
.search-box{flex:1;min-width:200px;max-width:360px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--white);transition:.15s;}
.search-box:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.toggle-group{display:flex;gap:6px;align-items:center;}
.toggle-btn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:12px;font-family:inherit;background:var(--white);color:var(--text-2);cursor:pointer;transition:.15s;user-select:none;}
.toggle-btn:hover{border-color:var(--blue);color:var(--blue);}
.toggle-btn.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.sort-sel{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;font-family:inherit;background:var(--white);cursor:pointer;}

/* ===== LIST ===== */
.content{max-width:900px;margin:0 auto;padding:0 28px 40px;}
.list{margin-top:4px;}
.list-item{border-bottom:1px solid var(--border-light);padding:14px 0;cursor:pointer;transition:.08s;}
.list-item:hover{background:var(--blue-light);margin:0 -16px;padding:14px 16px;border-radius:var(--radius);}
.row1{display:flex;align-items:baseline;gap:10px;}
.dday{font-size:13px;font-weight:700;min-width:44px;flex-shrink:0;}
.dday.urgent{color:var(--red);}
.dday.soon{color:var(--orange);}
.dday.ok{color:var(--green);}
.dday.closed{color:var(--text-3);}
.item-title{font-size:14px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item-deadline{font-size:12px;color:var(--text-3);flex-shrink:0;}
.row2{display:flex;align-items:center;gap:8px;margin-top:3px;padding-left:54px;}
.item-org{font-size:12px;color:var(--text-2);}
.item-sep{color:var(--border);font-size:10px;}
.item-target{font-size:11px;color:var(--text-3);}
.verify-badge{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;}
.v-yes{background:var(--green-light);color:#065F46;}
.v-no{background:var(--orange-light);color:#92400E;}
.row-memo{display:flex;align-items:center;gap:6px;margin-top:4px;padding-left:54px;}
.memo-text{font-size:12px;color:var(--blue);font-style:italic;}
.memo-input{flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;max-width:340px;display:none;}
.memo-btn{font-size:11px;color:var(--blue);cursor:pointer;background:none;border:none;font-family:inherit;padding:2px 6px;border-radius:4px;}
.memo-btn:hover{background:var(--blue-light);}

/* ===== DETAIL PANEL ===== */
.detail-panel{display:none;margin:0 0 8px;padding:16px 20px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);margin-left:54px;}
.detail-panel.open{display:block;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-bottom:12px;}
.detail-label{font-size:11px;color:var(--text-3);font-weight:500;margin-bottom:2px;}
.detail-val{font-size:13px;font-weight:500;color:var(--text);}
.detail-actions{display:flex;gap:8px;margin-top:8px;padding-top:12px;border-top:1px solid var(--border-light);}
.detail-actions a,.detail-actions button{font-size:12px;padding:6px 14px;border-radius:var(--radius);text-decoration:none;font-family:inherit;cursor:pointer;transition:.15s;}
.link-btn{background:var(--blue-light);color:var(--blue);border:none;font-weight:500;}
.link-btn:hover{background:var(--blue-bg);}
.cal-btn{background:var(--purple-light);color:var(--purple);border:none;font-weight:500;}
.cal-btn:hover{background:#EDE9FE;}

/* history accordion */
.history-toggle{font-size:12px;color:var(--text-2);cursor:pointer;background:none;border:none;font-family:inherit;padding:4px 0;margin-top:8px;display:flex;align-items:center;gap:4px;}
.history-toggle:hover{color:var(--blue);}
.history-content{display:none;margin-top:10px;padding:12px 16px;background:var(--bg);border-radius:var(--radius);}
.history-content.open{display:block;}
.history-year{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
.history-detail{font-size:12px;color:var(--text-2);line-height:1.7;margin-bottom:10px;}
.ref-item{font-size:12px;margin-bottom:4px;}
.ref-item a{color:var(--blue);text-decoration:none;}
.ref-item a:hover{text-decoration:underline;}

/* ===== CALENDAR ===== */
.cal-container{max-width:700px;margin:20px auto 0;}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px;}
.cal-nav-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s;}
.cal-nav-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
.cal-month{font-size:16px;font-weight:700;min-width:120px;text-align:center;}
.cal-today-btn{font-size:11px;padding:4px 12px;border-radius:16px;background:var(--blue);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:500;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-header{text-align:center;font-size:11px;font-weight:600;color:var(--text-3);padding:8px 0;}
.cal-cell{min-height:70px;padding:4px;border:1px solid var(--border-light);border-radius:4px;background:var(--white);transition:.1s;cursor:default;}
.cal-cell.other-month{background:var(--bg);opacity:.5;}
.cal-cell.today{border-color:var(--blue);background:var(--blue-light);}
.cal-day{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px;}
.cal-today-mark .cal-day{color:var(--blue);}
.cal-event{font-size:10px;padding:1px 4px;border-radius:3px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
.cal-event.urgent{background:var(--red-light);color:var(--red);}
.cal-event.soon{background:var(--orange-light);color:#92400E;}
.cal-event.normal{background:var(--blue-light);color:var(--blue);}

/* ===== CLOSED/REF TAB ===== */
.closed-list .list-item{opacity:.7;}
.closed-list .list-item:hover{opacity:1;}
.source-list{margin-top:12px;}
.source-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;transition:.15s;}
.source-item:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.04);}
.src-name{font-size:13px;font-weight:600;}
.src-note{font-size:11px;color:var(--text-3);margin-top:2px;}
.src-type{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--purple-light);color:var(--purple);font-weight:500;}
.src-url{font-size:11px;color:var(--blue);margin-top:2px;}
.section-label{font-size:13px;font-weight:600;color:var(--text-2);margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border-light);}

.empty-msg{text-align:center;padding:40px;color:var(--text-3);font-size:13px;}
.tab-content{display:none;}.tab-content.active{display:block;}
.new-dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;margin-left:4px;vertical-align:middle;}

/* toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:13px;z-index:999;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

@media(max-width:768px){
  .header,.tabs,.toolbar{padding-left:16px;padding-right:16px;}
  .content{padding:0 16px 40px;}
  .detail-grid{grid-template-columns:1fr;}
  .cal-cell{min-height:50px;}
  .cal-event{font-size:9px;}
  .row2{padding-left:44px;}
  .row-memo{padding-left:44px;}
  .detail-panel{margin-left:44px;}
  .dday{min-width:36px;font-size:12px;}
}

// ===== HELPERS =====
function getDday(d){ if(!d) return null; return Math.ceil((new Date(d) - TODAY) / 864e5); }

function ddayText(d){
  const dd = getDday(d);
  if(dd === null) return { text: '—', cls: 'closed' };
  if(dd < 0) return { text: '마감', cls: 'closed' };
  if(dd === 0) return { text: 'D-Day', cls: 'urgent' };
  if(dd <= 5) return { text: 'D-' + dd, cls: 'urgent' };
  if(dd <= 14) return { text: 'D-' + dd, cls: 'soon' };
  return { text: 'D-' + dd, cls: 'ok' };
}

function fmtDate(d){ if(!d) return '—'; const p = d.split('-'); return p[1] + '/' + p[2]; }
function fmtDateFull(d){ if(!d) return '—'; return d; }

function isNew(a){
  if(!a.openDate) return false;
  const diff = Math.ceil((TODAY - new Date(a.openDate)) / 864e5);
  return diff <= 3;
}

// ===== FILTER & SORT =====
function getActiveAnnouncements(){
  return announcements.filter(a => !a.closed && !a._autoExpired);
}

function getClosedAnnouncements(){
  const autoExpired = announcements.filter(a => a._autoExpired);
  return announcements.filter(a => a.closed).concat(autoExpired);
}

function applyFilters(list){
  let result = list;
  if(searchQuery){
    result = result.filter(a =>
      (a.title + ' ' + a.org + ' ' + a.type + ' ' + (a.note||'')).toLowerCase().includes(searchQuery)
    );
  }
  if(filters.danche) result = result.filter(a => a.target.includes('단체'));
  if(filters.gaein) result = result.filter(a => a.target.includes('개인'));
  if(filters.verified) result = result.filter(a => a.verified);
  return result;
}

function sortList(arr){
  const mode = document.getElementById('sort-sel').value;
  return [...arr].sort((a,b) => {
    if(mode === 'deadline'){
      const da = a.deadlineDate ? new Date(a.deadlineDate).getTime() : Infinity;
      const db = b.deadlineDate ? new Date(b.deadlineDate).getTime() : Infinity;
      return da - db;
    } else {
      const order = {high:0, mid:1, low:2};
      return (order[a.relevance]||2) - (order[b.relevance]||2);
    }
  });
}

// ===== .ICS GENERATOR =====
function downloadIcs(a){
  const start = a.deadlineDate ? a.deadlineDate.replace(/-/g,'') : '';
  if(!start){ showToast('마감일 정보가 없습니다'); return; }
  const end = start; // all-day event
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//세종국악//공고모니터링//KO',
    'BEGIN:VEVENT',
    'DTSTART;VALUE=DATE:' + start,
    'DTEND;VALUE=DATE:' + start,
    'SUMMARY:[마감] ' + a.title,
    'DESCRIPTION:기관: ' + a.org + '\\n대상: ' + a.target + '\\n예산: ' + a.budget + (a.applyUrl ? '\\n링크: ' + a.applyUrl : ''),
    'BEGIN:VALARM',
    'TRIGGER:-P1D',
    'ACTION:DISPLAY',
    'DESCRIPTION:내일 마감: ' + a.title,
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = a.title.replace(/[^가-힣a-zA-Z0-9 ]/g,'').substring(0,30) + '.ics';
  link.click();
  URL.revokeObjectURL(url);
  showToast('📅 캘린더 파일 다운로드 완료');
}

}

// ===== CALENDAR =====
function renderCalendar(){
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  document.getElementById('cal-month-label').textContent = `${y}년 ${m+1}월`;

  const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrev = new Date(y, m, 0).getDate();

  // events by date
  const events = {};
  announcements.filter(a => !a.closed && a.deadlineDate).forEach(a => {
    const d = a.deadlineDate;
    if(!events[d]) events[d] = [];
    events[d].push(a);
  });

  let html = '';
  const dayNames = ['일','월','화','수','목','금','토'];
  dayNames.forEach(d => { html += `<div class="cal-header">${d}</div>`; });

  const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

  for(let i = 0; i < totalCells; i++){
    const dayNum = i - firstDay + 1;
    let cellClass = 'cal-cell';
    let dateStr = '';
    let dayDisplay = '';

    if(dayNum < 1){
      cellClass += ' other-month';
      dayDisplay = daysInPrev + dayNum;
    } else if(dayNum > daysInMonth){
      cellClass += ' other-month';
      dayDisplay = dayNum - daysInMonth;
    } else {
      dayDisplay = dayNum;
      const mm = String(m+1).padStart(2,'0');
      const dd = String(dayNum).padStart(2,'0');
      dateStr = `${y}-${mm}-${dd}`;
      if(dateStr === TODAY_STR) cellClass += ' today cal-today-mark';
    }

    html += `<div class="${cellClass}">`;
    html += `<div class="cal-day">${dayDisplay}</div>`;

    if(dateStr && events[dateStr]){
      events[dateStr].forEach(a => {
        const dday = getDday(a.deadlineDate);
        let evtCls = 'normal';
        if(dday !== null && dday <= 3) evtCls = 'urgent';
        else if(dday !== null && dday <= 7) evtCls = 'soon';
        html += `<div class="cal-event ${evtCls}" onclick="switchTab('list');setTimeout(()=>{toggleDetail(${a.id});scrollToItem(${a.id})},100)" title="${a.title}">${a.title.substring(0,12)}</div>`;
      });
    }
    html += `</div>`;
  }

  document.getElementById('cal-grid').innerHTML = html;
}

function calNav(d){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+d, 1); renderCalendar(); }
function calGoToday(){ calMonth = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); renderCalendar(); }

// ===== ACTIONS =====
function switchTab(t){
  document.querySelectorAll('.tab').forEach((x,i) => x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  // activate tab button
  const tabNames = ['list','calendar','closed'];
  const idx = tabNames.indexOf(t);
  if(idx >= 0) document.querySelectorAll('.tab')[idx].classList.add('active');
  if(t === 'calendar') renderCalendar();
  if(t === 'closed') renderClosed();
}

function toggleDetail(id, evt){
  if(evt && (evt.target.closest('.memo-btn') || evt.target.closest('.memo-input') || evt.target.closest('.detail-actions') || evt.target.closest('.history-toggle') || evt.target.closest('.history-content'))) return;
  openDetailId = openDetailId === id ? null : id;
  renderList();
}

function toggleHistory(id, evt){
  if(evt) evt.stopPropagation();
  openHistoryId = openHistoryId === id ? null : id;
  renderList();
}

function scrollToItem(id){
  const items = document.querySelectorAll('.list-item');
  items.forEach(el => {
    if(el.getAttribute('onclick') && el.getAttribute('onclick').includes(id)){
      el.scrollIntoView({behavior:'smooth', block:'center'});
    }
  });
}

function onSearch(){
  searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
  renderList();
}

function toggleFilter(key){
  if(key === 'danche'){
    filters.danche = !filters.danche;
    if(filters.danche) filters.gaein = false;
  } else if(key === 'gaein'){
    filters.gaein = !filters.gaein;
    if(filters.gaein) filters.danche = false;
  } else {
    filters[key] = !filters[key];
  }
  document.getElementById('tgl-danche').classList.toggle('on', filters.danche);
  document.getElementById('tgl-gaein').classList.toggle('on', filters.gaein);
  document.getElementById('tgl-verified').classList.toggle('on', filters.verified);
  renderList();
}

function startEditMemo(id, evt){
  if(evt) evt.stopPropagation();
  const input = document.getElementById('memo-input-' + id);
  if(input){
    input.style.display = 'block';
    input.focus();
  }
}

function saveMemoFromInput(id){
  const input = document.getElementById('memo-input-' + id);
  if(!input) return;
  const text = input.value.trim();
  input.style.display = 'none';
  if(text){
    saveMemo(id, text);
    showToast('메모 저장됨');
  } else {
    deleteMemo(id);
  }
  renderList();
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ===== RENDER ALL =====
function renderAll(){
  renderList();
}

// ===== INIT =====
loadMemos();
</script>
</body>
</html>
