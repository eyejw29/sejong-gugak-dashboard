<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세종국악관현악단 — 공고 모니터링</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F5F6F8;--white:#FFF;--border:#E2E5EA;--border-light:#ECEEF2;
  --text:#1A1D24;--text-2:#5A6070;--text-3:#8E95A5;
  --blue:#2563EB;--blue-50:#EFF6FF;--blue-100:#DBEAFE;--blue-600:#2563EB;--blue-700:#1D4ED8;
  --red:#EF4444;--red-50:#FEF2F2;--red-100:#FEE2E2;
  --orange:#F59E0B;--orange-50:#FFFBEB;--orange-100:#FEF3C7;
  --green:#10B981;--green-50:#ECFDF5;--green-100:#D1FAE5;
  --purple:#8B5CF6;--purple-50:#F5F3FF;
  --radius:10px;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow:0 2px 8px rgba(0,0,0,.08);
}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;}

/* ===== HEADER ===== */
.header{background:var(--white);border-bottom:1px solid var(--border);padding:18px 32px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);}
.header-row{display:flex;justify-content:space-between;align-items:center;}
.header-left{display:flex;align-items:center;gap:20px;}
.header h1{font-size:17px;font-weight:700;color:var(--text);}
.header-badge{display:flex;gap:12px;}
.hb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);padding:4px 10px;border-radius:6px;background:var(--bg);}
.hb strong{font-weight:700;color:var(--text);}
.hb.urgent strong{color:var(--red);}
.header-right{text-align:right;}
.header-date{font-size:12px;color:var(--text-3);}

/* ===== TABS ===== */
.tabs{display:flex;background:var(--white);border-bottom:1px solid var(--border);padding:0 32px;gap:0;}
.tab{padding:12px 20px;font-size:13px;font-weight:500;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;user-select:none;}
.tab:hover{color:var(--blue);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}

/* ===== TOOLBAR ===== */
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 0;flex-wrap:wrap;}
.search-box{width:260px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--white);transition:.15s;box-shadow:var(--shadow-sm);}
.search-box:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
.divider{width:1px;height:22px;background:var(--border);margin:0 4px;}
.toggle-btn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:12px;font-family:inherit;background:var(--white);color:var(--text-2);cursor:pointer;transition:.15s;user-select:none;}
.toggle-btn:hover{border-color:var(--blue-600);color:var(--blue-600);}
.toggle-btn.on{background:var(--blue-600);color:#fff;border-color:var(--blue-600);}
.sort-sel{padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;font-family:inherit;background:var(--white);cursor:pointer;margin-left:auto;}

/* ===== LIST ===== */
.content{max-width:880px;margin:0 auto;padding:0 32px 60px;}
.list{display:flex;flex-direction:column;gap:12px;margin-top:4px;}

/* ===== CARD ===== */
.card{background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);position:relative;transition:.15s;}
.card:hover{box-shadow:var(--shadow);}
.rel-bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--radius) 0 0 var(--radius);}
.rel-high{background:var(--green);}
.rel-mid{background:var(--orange);}
.rel-low{background:var(--border);}

/* Row 1: 헤더 (D-day + 제목 + 마감) */
.card-header{display:grid;grid-template-columns:64px 1fr auto;align-items:center;padding:16px 20px 10px 20px;gap:0 14px;}
.dday-badge{text-align:center;font-weight:700;font-size:14px;line-height:1;padding:8px 4px;border-radius:8px;}
.dday-badge.urgent{background:var(--red-100);color:var(--red);}
.dday-badge.soon{background:var(--orange-100);color:#D97706;}
.dday-badge.ok{background:var(--green-100);color:#059669;}
.dday-badge.closed{background:var(--bg);color:var(--text-3);}
.dday-sub{font-size:9px;font-weight:500;margin-top:3px;opacity:.8;}

.card-title-area{min-width:0;}
.card-title{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap;}
.meta-org{font-size:12px;color:var(--text-2);font-weight:500;}
.meta-sep{color:var(--border);font-size:9px;}
.meta-target{font-size:11px;color:var(--text-3);}
.meta-type{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--purple-50);color:var(--purple);font-weight:500;}
.verify-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;}
.v-yes{background:var(--green-50);color:#065F46;}
.v-no{background:var(--orange-50);color:#92400E;}
.new-dot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;margin-left:5px;vertical-align:middle;}

.card-deadline{text-align:right;flex-shrink:0;min-width:64px;}
.deadline-date{font-size:14px;font-weight:600;color:var(--text-2);}
.deadline-label{font-size:10px;color:var(--text-3);margin-top:1px;}

/* Row 2: 핵심 정보 3칸 (항상 표시) */
.card-info{display:grid;grid-template-columns:1fr 1fr 1fr;margin:0 20px 12px 20px;border-radius:8px;overflow:hidden;border:1px solid var(--border-light);background:var(--bg);}
.info-cell{padding:10px 14px;border-right:1px solid var(--border-light);}
.info-cell:last-child{border-right:none;}
.info-label{font-size:10px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.info-val{font-size:13px;font-weight:600;color:var(--text);line-height:1.4;}
.info-val.fit-yes{color:var(--green);}
.info-val.fit-maybe{color:var(--orange);}
.info-val.fit-no{color:var(--red);}
.info-val.budget{color:var(--blue-600);}
.info-sub{font-size:10px;color:var(--text-3);margin-top:1px;}

/* 2026-05-10 (사용자: 오은재 담당자 요청, 룰 6 가벼운 변경): 단순 현황 공유 모드 — 진행상태 항목 가리기 */
.card-memo-area{display:none !important;}
.verify-badge{display:none !important;}

/* Row 3: 메모 박스 (가려진 상태, 데이터는 보존됨) */
.card-memo-area-orig{margin:0 20px 12px;padding:10px 14px;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:8px;display:flex;align-items:center;gap:10px;min-height:40px;}
.card-memo-area.empty{background:var(--bg);border-color:var(--border-light);border-style:dashed;}
.memo-icon{font-size:14px;flex-shrink:0;}
.memo-text{font-size:13px;color:var(--blue-700);font-weight:500;flex:1;}
.memo-placeholder{font-size:12px;color:var(--text-3);flex:1;}
.memo-btn{font-size:11px;color:var(--blue-600);cursor:pointer;background:none;border:none;font-family:inherit;padding:4px 10px;border-radius:6px;font-weight:500;flex-shrink:0;}
.memo-btn:hover{background:var(--blue-100);}
.memo-input{flex:1;padding:6px 10px;border:1px solid var(--blue);border-radius:6px;font-size:13px;font-family:inherit;outline:none;display:none;background:var(--white);}

/* Row 4: 액션 + 노트 */
.card-footer{padding:0 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.card-note{font-size:12px;color:var(--text-2);flex:1;min-width:200px;}
.card-note span{background:var(--orange-50);padding:2px 8px;border-radius:4px;}
.card-actions{display:flex;gap:6px;flex-shrink:0;}
.card-actions a,.card-actions button{font-size:11px;padding:6px 14px;border-radius:8px;text-decoration:none;font-family:inherit;cursor:pointer;transition:.15s;font-weight:500;border:none;}
.btn-primary{background:var(--blue-600);color:#fff;}
.btn-primary:hover{background:var(--blue-700);}
.btn-secondary{background:var(--white);color:var(--text-2);border:1px solid var(--border) !important;}
.btn-secondary:hover{background:var(--bg);}

/* 접이식: 상세 + 이력 (클릭 시) */
.card-expand{display:block;border-top:1px solid var(--border-light);padding:16px 20px;background:var(--bg);}
.card-expand.open{display:block;}
.expand-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;}
.exp-label{font-size:10px;color:var(--text-3);font-weight:600;letter-spacing:.3px;}
.exp-val{font-size:12px;color:var(--text);font-weight:500;margin-top:1px;}
/* 2026-05-10: 공고일/마감일 강조 (오은재 담당자 명령) */
.exp-val.deadline-highlight{font-size:14px;color:var(--text);font-weight:600;letter-spacing:.02em;}
.exp-val.deadline-highlight strong{color:var(--red,#B8342A);font-size:15px;}
.expand-toggle{display:none !important;} /* 2026-05-10: 토글 버튼 제거, 항상 펼침 */

/* 2026-05-10: 월별·기간 필터 toolbar */
.period-toolbar{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--white);border-bottom:1px solid var(--border-light);}
.period-toolbar .period-label{font-size:12px;font-weight:600;color:var(--text-2);margin-right:4px;}
.period-toolbar .period-sep{font-size:11px;color:var(--text-3);}
.period-toolbar .date-input{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;font-family:inherit;color:var(--text);background:var(--white);outline:none;}
.period-toolbar .date-input:focus{border-color:var(--blue);}
@media (max-width:768px){.period-toolbar{padding:8px 16px;}}

/* history */
.history-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light);}
.history-toggle{font-size:12px;color:var(--text-2);cursor:pointer;background:none;border:none;font-family:inherit;padding:4px 0;display:flex;align-items:center;gap:4px;font-weight:500;}
.history-toggle:hover{color:var(--blue);}
.history-content{display:none;margin-top:10px;padding:12px 16px;background:var(--white);border-radius:var(--radius);border:1px solid var(--border-light);}
.history-content.open{display:block;}
.history-year{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
.history-detail{font-size:12px;color:var(--text-2);line-height:1.7;margin-bottom:10px;}
.ref-item{font-size:12px;margin-bottom:4px;}
.ref-item a{color:var(--blue);text-decoration:none;}
.ref-item a:hover{text-decoration:underline;}

/* ===== CALENDAR ===== */
.cal-container{max-width:720px;margin:20px auto 0;}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px;}
.cal-nav-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:var(--shadow-sm);}
.cal-nav-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
.cal-month{font-size:17px;font-weight:700;min-width:120px;text-align:center;}
.cal-today-btn{font-size:11px;padding:5px 14px;border-radius:16px;background:var(--blue);color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:500;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-header{text-align:center;font-size:11px;font-weight:600;color:var(--text-3);padding:8px 0;}
.cal-cell{min-height:74px;padding:5px;border:1px solid var(--border-light);border-radius:6px;background:var(--white);}
.cal-cell.other-month{background:var(--bg);opacity:.4;}
.cal-cell.today{border-color:var(--blue);background:var(--blue-50);box-shadow:inset 0 0 0 1px var(--blue);}
.cal-day{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px;}
.cal-today-mark .cal-day{color:var(--blue);}
.cal-event{font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-weight:500;}
.cal-event.urgent{background:var(--red-100);color:var(--red);}
.cal-event.soon{background:var(--orange-100);color:#92400E;}
.cal-event.normal{background:var(--blue-100);color:var(--blue-700);}

/* ===== CLOSED/REF ===== */
.section-label{font-size:13px;font-weight:600;color:var(--text-2);margin:24px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border-light);}
.source-item{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;transition:.15s;box-shadow:var(--shadow-sm);}
.source-item:hover{border-color:var(--blue);box-shadow:var(--shadow);}
.src-name{font-size:13px;font-weight:600;}
.src-note{font-size:11px;color:var(--text-3);margin-top:2px;}
.src-type{font-size:10px;padding:3px 10px;border-radius:4px;background:var(--purple-50);color:var(--purple);font-weight:500;}
.src-url{font-size:11px;color:var(--blue);margin-top:2px;}

.empty-msg{text-align:center;padding:48px;color:var(--text-3);font-size:13px;}
.tab-content{display:none;}.tab-content.active{display:block;}

/* toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:13px;z-index:999;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

@media(max-width:768px){
  .header{padding:14px 16px;}
  .header-badge{display:none;}
  .tabs{padding:0 16px;}
  .content{padding:0 16px 40px;}
  .card-header{grid-template-columns:52px 1fr auto;padding:12px 14px 8px;gap:0 10px;}
  .card-info{grid-template-columns:1fr;margin:0 14px 10px;}
  .info-cell{border-right:none;border-bottom:1px solid var(--border-light);}
  .info-cell:last-child{border-bottom:none;}
  .card-memo-area{margin:0 14px 10px;}
  .card-footer{padding:0 14px 12px;}
  .card-expand{padding:14px;}
  .expand-grid{grid-template-columns:1fr;}
  .cal-cell{min-height:50px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-row">
    <div class="header-left">
      <h1>세종국악관현악단 공고 모니터링</h1>
      <div class="header-badge">
        <div class="hb">접수중 <strong id="s-total">0</strong></div>
        <div class="hb urgent">마감임박 <strong id="s-urgent">0</strong></div>
        <div class="hb">메모 <strong id="s-memo">0</strong></div>
      </div>
    </div>
    <div class="header-right">
      <div class="header-date" id="header-date"></div>
      <div class="header-date" id="update-info" style="margin-top:1px;"></div>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('list')">📋 공고 리스트</div>
  <div class="tab" onclick="switchTab('calendar')">📅 연간 일정표</div>
  <div class="tab" onclick="switchTab('closed')">📁 종료/참고</div>
</div>

<!-- CONTENT -->
<div class="content">

<div class="tab-content active" id="tab-list">
  <div class="toolbar">
    <input type="text" class="search-box" id="search-input" placeholder="검색..." oninput="onSearch()">
    <div class="divider"></div>
    <button class="toggle-btn" id="tgl-danche" onclick="toggleFilter('danche')">단체</button>
    <button class="toggle-btn" id="tgl-gaein" onclick="toggleFilter('gaein')">개인</button>
    <button class="toggle-btn" id="tgl-verified" onclick="toggleFilter('verified')">✅ 검증만</button>
    <select class="sort-sel" id="sort-sel" onchange="renderList()">
      <option value="deadline">마감일순</option>
      <option value="relevance">관련도순</option>
    </select>
  </div>
  <!-- 2026-05-10: 월별·기간 필터 (오은재 담당자 명령) -->
  <div class="toolbar period-toolbar">
    <span class="period-label">📅 마감 기준</span>
    <select class="sort-sel" id="month-sel" onchange="onMonthChange()">
      <option value="all">전체 기간</option>
    </select>
    <span class="period-sep">또는</span>
    <input type="date" class="date-input" id="date-from" onchange="onDateRangeChange()">
    <span class="period-sep">~</span>
    <input type="date" class="date-input" id="date-to" onchange="onDateRangeChange()">
    <button class="toggle-btn" onclick="resetPeriodFilter()">초기화</button>
  </div>
  <div class="list" id="main-list"></div>
</div>

<div class="tab-content" id="tab-calendar">
  <div class="cal-container">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calNav(-1)">◀</button>
      <div class="cal-month" id="cal-month-label"></div>
      <button class="cal-nav-btn" onclick="calNav(1)">▶</button>
      <button class="cal-today-btn" onclick="calGoToday()">오늘</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<div class="tab-content" id="tab-closed">
  <div class="section-label">📁 마감된 공고 (차기 대비용)</div>
  <!-- 2026-05-10: 종료/참고 기간 조회 (오은재 담당자 명령) -->
  <div class="toolbar period-toolbar">
    <span class="period-label">📅 마감 기준</span>
    <select class="sort-sel" id="closed-month-sel" onchange="onClosedMonthChange()">
      <option value="all">전체 기간</option>
    </select>
    <span class="period-sep">또는</span>
    <input type="date" class="date-input" id="closed-date-from" onchange="onClosedDateRangeChange()">
    <span class="period-sep">~</span>
    <input type="date" class="date-input" id="closed-date-to" onchange="onClosedDateRangeChange()">
    <button class="toggle-btn" onclick="resetClosedPeriodFilter()">초기화</button>
  </div>
  <div class="list" id="closed-list"></div>
  <div class="section-label" style="margin-top:32px;">📡 모니터링 소스</div>
  <div id="source-list"></div>
</div>

</div>

<div class="toast" id="toast"></div>

<script>

// ===== HELPERS =====
function getDday(d){ if(!d) return null; return Math.ceil((new Date(d)-TODAY)/864e5); }
function ddayInfo(d){
  const dd=getDday(d);
  if(dd===null) return {text:'—',sub:'',cls:'closed'};
  if(dd<0) return {text:'마감',sub:'종료',cls:'closed'};
  if(dd===0) return {text:'D-Day',sub:'오늘 마감',cls:'urgent'};
  if(dd<=5) return {text:'D-'+dd,sub:'마감임박',cls:'urgent'};
  if(dd<=14) return {text:'D-'+dd,sub:'접수중',cls:'soon'};
  return {text:'D-'+dd,sub:'접수중',cls:'ok'};
}
function fmtShort(d){ if(!d) return '—'; const p=d.split('-'); return p[1]+'.'+p[2]; }
function isNew(a){ if(!a.openDate) return false; return Math.ceil((TODAY-new Date(a.openDate))/864e5)<=3; }
function getActive(){ return announcements.filter(a=>!a.closed&&!a._autoExpired); }
function getClosed(){ return announcements.filter(a=>a.closed).concat(announcements.filter(a=>a._autoExpired)); }
function applyFilters(list){
  let r=list;
  if(searchQuery) r=r.filter(a=>(a.title+' '+a.org+' '+a.type+' '+(a.note||'')).toLowerCase().includes(searchQuery));
  if(filters.danche) r=r.filter(a=>a.target.includes('단체'));
  if(filters.gaein) r=r.filter(a=>a.target.includes('개인'));
  if(filters.verified) r=r.filter(a=>a.verified);
  return r;
}

// 2026-05-10: 기간 필터 (deadlineDate 기준)
function applyPeriodFilter(list, pf){
  if(!pf || (pf.month==='all' && !pf.from && !pf.to)) return list;
  return list.filter(a=>{
    if(!a.deadlineDate) return false;
    const dl=a.deadlineDate;
    if(pf.month && pf.month!=='all'){
      if(!dl.startsWith(pf.month)) return false;
    }
    if(pf.from && dl<pf.from) return false;
    if(pf.to && dl>pf.to) return false;
    return true;
  });
}
// 월 옵션 동적 생성: announcements의 deadlineDate에서 unique YYYY-MM 추출
function buildMonthOptions(list, selectId, currentValue){
  const months=[...new Set(list.filter(a=>a.deadlineDate).map(a=>a.deadlineDate.substring(0,7)))].sort();
  const sel=document.getElementById(selectId);
  if(!sel) return;
  const cur=currentValue||sel.value||'all';
  sel.innerHTML='<option value="all">전체 기간</option>'+months.map(m=>{
    const [y,mm]=m.split('-');
    return `<option value="${m}"${m===cur?' selected':''}>${y}년 ${parseInt(mm,10)}월</option>`;
  }).join('');
}
function sortList(arr){
  const mode=document.getElementById('sort-sel').value;
  return [...arr].sort((a,b)=>{
    if(mode==='deadline') return (a.deadlineDate?new Date(a.deadlineDate).getTime():Infinity)-(b.deadlineDate?new Date(b.deadlineDate).getTime():Infinity);
    const o={high:0,mid:1,low:2}; return (o[a.relevance]||2)-(o[b.relevance]||2);
  });
}

// ===== .ICS =====
function downloadIcs(a){
  const start=a.deadlineDate?a.deadlineDate.replace(/-/g,''):'';
  if(!start){showToast('마감일 정보 없음');return;}
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//세종국악//공고//KO','BEGIN:VEVENT',
    'DTSTART;VALUE=DATE:'+start,'DTEND;VALUE=DATE:'+start,
    'SUMMARY:[마감] '+a.title,
    'DESCRIPTION:기관: '+a.org+'\\n대상: '+a.target+'\\n예산: '+a.budget+(a.applyUrl?'\\n링크: '+a.applyUrl:''),
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:내일 마감: '+a.title,'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const el=document.createElement('a');el.href=url;
  el.download=a.title.replace(/[^가-힣a-zA-Z0-9 ]/g,'').substring(0,30)+'.ics';
  el.click();URL.revokeObjectURL(url);
  showToast('📅 캘린더에 추가 완료');
}
function showToast(msg){ const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200); }

  const fitCls=a.qualifyFit==='yes'?'fit-yes':a.qualifyFit==='maybe'?'fit-maybe':'fit-no';
  const fitTxt=a.qualifyFit==='yes'?'✅ 지원 가능':a.qualifyFit==='maybe'?'⚠️ 조건부':'❌ 해당없음';

  let h=`<div class="card" id="card-${a.id}"><div class="rel-bar ${rel}"></div>`;

  // Row 1: 헤더
  h+=`<div class="card-header">`;
  h+=`<div class="dday-badge ${dd.cls}"><div>${dd.text}</div><div class="dday-sub">${dd.sub}</div></div>`;
  h+=`<div class="card-title-area">`;
  h+=`<div class="card-title">${a.title}${isNew(a)?'<span class="new-dot"></span>':''}</div>`;
  h+=`<div class="card-meta">`;
  h+=`<span class="meta-org">${a.org}</span><span class="meta-sep">·</span>`;
  h+=`<span class="meta-target">${a.target}</span><span class="meta-sep">·</span>`;
  h+=`<span class="meta-type">${a.type}</span>`;
  h+=`<span class="verify-badge ${a.verified?'v-yes':'v-no'}">${a.verified?'✅ 검증':'⚠ 확인필요'}</span>`;
  h+=`</div></div>`;
  h+=`<div class="card-deadline"><div class="deadline-date">~${fmtShort(a.deadlineDate)}</div><div class="deadline-label">마감</div></div>`;
  h+=`</div>`;

  // Row 2: 핵심정보 3칸 (항상 노출)
  h+=`<div class="card-info">`;
  h+=`<div class="info-cell"><div class="info-label">적합도</div><div class="info-val ${fitCls}">${fitTxt}</div></div>`;
  h+=`<div class="info-cell"><div class="info-label">지원 예산</div><div class="info-val budget">${a.budget||'—'}</div>`;
  if(a.budgetScale) h+=`<div class="info-sub">${a.budgetScale}</div>`;

  h+=`</div>`;

  // Row 3: 메모 박스
  if(showMemo!==false){
    if(memo){
      h+=`<div class="card-memo-area">`;
      h+=`<span class="memo-icon">📝</span>`;
      h+=`<span class="memo-text">${escHtml(memo)}</span>`;
      h+=`<button class="memo-btn" onclick="startEditMemo(${a.id},event)">수정</button>`;
      h+=`<input class="memo-input" id="memo-input-${a.id}" placeholder="메모 입력 후 Enter" onkeydown="if(event.key==='Enter')saveMemoFromInput(${a.id})" onblur="saveMemoFromInput(${a.id})" value="${escAttr(memo)}">`;
      h+=`</div>`;
    } else {
      h+=`<div class="card-memo-area empty">`;
      h+=`<span class="memo-icon">📝</span>`;
      h+=`<span class="memo-placeholder">메모를 추가하세요</span>`;
      h+=`<button class="memo-btn" onclick="startEditMemo(${a.id},event)">+ 작성</button>`;
      h+=`<input class="memo-input" id="memo-input-${a.id}" placeholder="메모 입력 후 Enter" onkeydown="if(event.key==='Enter')saveMemoFromInput(${a.id})" onblur="saveMemoFromInput(${a.id})" value="">`;
      h+=`</div>`;
    }
  }

  // Row 4: 하단 (노트 + 액션)
  h+=`<div class="card-footer">`;
  h+=`<div class="card-note">${a.note?'<span>💡 '+a.note+'</span>':''}</div>`;
  h+=`<div class="card-actions">`;
  const linkUrl=a.verifyUrl||a.applyUrl;
  if(linkUrl) h+=`<a href="${linkUrl}" target="_blank" class="btn-primary">🔗 원문 보기</a>`;
  // 2026-05-10: 캘린더 추가 버튼 제거 (오은재 담당자 명령, 미사용)
  h+=`</div></div>`;

  h+=`<div class="card-expand ${isExpanded?'open':''}" id="expand-${a.id}">`;
  h+=`<div class="expand-grid">`;

  h+=`</div>`;

  // history
  if(a.history&&a.history.length>0){
    const hOpen=openHistoryId===a.id;
    h+=`<div class="history-section">`;
    h+=`<button class="history-toggle" onclick="toggleHistory(${a.id},event)">${hOpen?'▼':'▶'} 과거 이력 & 관련 자료</button>`;
    h+=`<div class="history-content ${hOpen?'open':''}" id="history-${a.id}">`;
    a.history.forEach(hi=>{

    });
    if(a.references&&a.references.length>0){
      h+=`<div style="font-size:12px;font-weight:600;margin:8px 0 4px;">📰 관련 자료</div>`;
      a.references.forEach(r=>{h+=`<div class="ref-item"><a href="${r.url}" target="_blank">${r.title}</a> <span style="color:var(--text-3);font-size:10px;">${r.type||''} ${r.date||''}</span></div>`;});
    }
    h+=`</div></div>`;
  }
  h+=`</div>`;

  // 2026-05-10: 토글 버튼 제거 (항상 펼침, 오은재 담당자 명령)

  h+=`</div>`;
  return h;
}

    total:active.length,
    urgent:active.filter(a=>{const d=getDday(a.deadlineDate);return d!==null&&d>=0&&d<=7;}).length,
    memo:Object.keys(memos).filter(k=>memos[k]).length
  };
  document.getElementById('s-total').textContent=stats.total;
  document.getElementById('s-urgent').textContent=stats.urgent;

// ===== CALENDAR =====
function renderCalendar(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  document.getElementById('cal-month-label').textContent=`${y}년 ${m+1}월`;
  const firstDay=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const dimPrev=new Date(y,m,0).getDate();
  const events={};
  announcements.filter(a=>!a.closed&&a.deadlineDate).forEach(a=>{
    if(!events[a.deadlineDate]) events[a.deadlineDate]=[];
    events[a.deadlineDate].push(a);
  });
  let h='';
  ['일','월','화','수','목','금','토'].forEach(d=>{h+=`<div class="cal-header">${d}</div>`;});
  const total=Math.ceil((firstDay+dim)/7)*7;
  for(let i=0;i<total;i++){
    const dn=i-firstDay+1;
    let cls='cal-cell',ds='',dd='';
    if(dn<1){cls+=' other-month';dd=dimPrev+dn;}
    else if(dn>dim){cls+=' other-month';dd=dn-dim;}
    else{dd=dn;ds=`${y}-${String(m+1).padStart(2,'0')}-${String(dn).padStart(2,'0')}`;if(ds===TODAY_STR)cls+=' today cal-today-mark';}
    h+=`<div class="${cls}"><div class="cal-day">${dd}</div>`;
    if(ds&&events[ds]){
      events[ds].forEach(a=>{
        const dday=getDday(a.deadlineDate);
        let ec='normal';if(dday!==null&&dday<=3)ec='urgent';else if(dday!==null&&dday<=7)ec='soon';
        h+=`<div class="cal-event ${ec}" onclick="switchTab('list');setTimeout(()=>{expandedIds.add(${a.id});renderList();document.getElementById('card-${a.id}')&&document.getElementById('card-${a.id}').scrollIntoView({behavior:'smooth',block:'center'})},150)" title="${a.title}">${a.title.substring(0,10)}</div>`;
      });
    }
    h+=`</div>`;
  }
  document.getElementById('cal-grid').innerHTML=h;
}

}
function saveMemoFromInput(id){
  const input=document.getElementById('memo-input-'+id);
  if(!input)return;
  const text=input.value.trim();
  input.style.display='none';
  if(text){saveMemo(id,text);showToast('메모 저장됨');}
  else{deleteMemo(id);}
  renderList();
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function renderAll(){renderList();}

loadMemos();
</script>
