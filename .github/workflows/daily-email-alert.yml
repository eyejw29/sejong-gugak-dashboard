name: 임박 공고 리마인더 (D-7/D-3/D-1/D-0)

on:
  schedule:
    # 매일 오전 8:00 KST (UTC 23:00 전일)
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: 공고 데이터 가져오기
        run: |
          DATA_URL="https://raw.githubusercontent.com/eyejw29/sejong-gugak-dashboard/main/data/announcements.json"
          curl -sf "$DATA_URL" -o announcements.json || echo "[]" > announcements.json

      - name: 임박 항목 필터링 후 발송
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: "eyejw29@gmail.com"
          GMAIL_RECIPIENT: "sejong-8784@hanmail.net"
          GMAIL_CC: "eyejw29@gmail.com"
          DASHBOARD_URL: "https://admin.sejonggugak.com/#/notices-monitor"
          EXTRA_RECIPIENTS: ${{ secrets.EXTRA_RECIPIENTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import json, smtplib, os, sys
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime, timezone, timedelta

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)
          today = now.strftime("%Y-%m-%d")
          weekday = ["월","화","수","목","금","토","일"][now.weekday()]

          SENDER = os.environ["GMAIL_SENDER"]
          RECIPIENT = os.environ["GMAIL_RECIPIENT"]
          CC = os.environ.get("GMAIL_CC", "")
          APP_PW = os.environ.get("GMAIL_APP_PASSWORD", "")
          DASHBOARD = os.environ["DASHBOARD_URL"]

          if not APP_PW:
              print("[오류] GMAIL_APP_PASSWORD 시크릿 미설정")
              sys.exit(1)

          with open("announcements.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          # D-7/D-3/D-1/D-0 만 필터
          REMIND_DAYS = {0, 1, 3, 7}
          targets = []
          today_dt = datetime.strptime(today, "%Y-%m-%d")
          for item in data:
              if item.get("closed", False):
                  continue
              dl = item.get("deadlineDate")
              if not dl:
                  continue
              try:
                  d_day = (datetime.strptime(dl, "%Y-%m-%d") - today_dt).days
                  if d_day in REMIND_DAYS:
                      item["_dday"] = d_day
                      targets.append(item)
              except Exception:
                  pass

          if not targets:
              print(f"[스킵] {today} ({weekday}) — D-7/D-3/D-1/D-0 해당 항목 없음. 발송 안 함.")
              sys.exit(0)

          targets.sort(key=lambda x: x["_dday"])

          # 본문
          def fmt_dday(d):
              if d == 0: return "🚨 D-0 (오늘 마감!)"
              if d == 1: return "🔴 D-1 (내일 마감)"
              if d == 3: return "🟠 D-3"
              if d == 7: return "🟡 D-7"
              return f"D-{d}"

          lines = [
              f"🎵 세종국악 — 마감 임박 리마인더",
              f"",
              f"{today} ({weekday}) — 임박 {len(targets)}건",
              f"",
              f"{'─'*40}",
          ]
          for item in targets:
              lines.append("")
              lines.append(f"▸ {item['title']}")
              lines.append(f"  {fmt_dday(item['_dday'])}  ·  마감: {item.get('deadlineDate','미정')}")
              org_line = f"  🏛 {item.get('org','')}"
              if item.get('relevance') == 'high':
                  org_line += "  ·  ⭐ 핵심 매칭"
              lines.append(org_line)
              if item.get('applyUrl'):
                  lines.append(f"  📎 {item['applyUrl']}")

          lines += [
              f"",
              f"{'─'*40}",
              f"",
              f"📋 자세한 내용은 관리자 페이지에서 확인하세요",
              f"   {DASHBOARD}",
              f"※ 임박 항목이 있을 때만 발송됩니다. (D-7/D-3/D-1/D-0)",
          ]
          body = "\n".join(lines)

          # 제목
          ddays = sorted({t["_dday"] for t in targets})
          parts = []
          for d in ddays:
              cnt = sum(1 for t in targets if t["_dday"] == d)
              parts.append(f"D-{d} {cnt}건")
          subject = f"[세종국악] 임박 — {today} ({', '.join(parts)})"

          # 발송
          msg = MIMEMultipart("alternative")
          msg["Subject"] = subject
          msg["From"] = f"세종국악 공고알림 <{SENDER}>"
          msg["To"] = RECIPIENT
          if CC:
              msg["Cc"] = CC
          msg.attach(MIMEText(body, "plain", "utf-8"))

          # 2026-05-11: EXTRA_RECIPIENTS Secrets 콤마 구분 — 담당자 개인 메일 추가
          extras = [e.strip() for e in (os.environ.get("EXTRA_RECIPIENTS") or "").split(",") if e.strip()]
          recipients = [RECIPIENT] + ([CC] if CC else []) + extras
          if extras:
              # BCC로 추가 (TO/CC에 노출 안 시킴)
              msg["Bcc"] = ", ".join(extras)
          try:
              with smtplib.SMTP("smtp.gmail.com", 587) as server:
                  server.starttls()
                  server.login(SENDER, APP_PW)
                  server.send_message(msg, to_addrs=recipients)
              print(f"[성공] 임박 리마인더 발송 완료 → {recipients}")
              print(f"제목: {subject}")
          except smtplib.SMTPAuthenticationError:
              print("[오류] Gmail 인증 실패")
              sys.exit(1)
          except Exception as e:
              print(f"[오류] 발송 실패: {e}")
              sys.exit(1)

          # ─── 텔레그램 백업 발송 ───
          tg_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          tg_chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if tg_token and tg_chat:
              import urllib.request, urllib.parse
              # 4096자 제한 — 임박 리마인더는 보통 짧지만 안전하게 자름
              tg_msg = body[:3900]
              if len(body) > 3900:
                  tg_msg += "\n\n…(생략, 메일에서 전체 확인)"
              try:
                  req = urllib.request.Request(
                      f"https://api.telegram.org/bot{tg_token}/sendMessage",
                      data=urllib.parse.urlencode({
                          "chat_id": tg_chat,
                          "text": tg_msg,
                          "disable_web_page_preview": "true",
                      }).encode("utf-8"),
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      print(f"[성공] 텔레그램 발송 완료 ({resp.status})")
              except Exception as e:
                  print(f"[경고] 텔레그램 발송 실패 (메일은 성공): {e}")
          else:
              print("[정보] 텔레그램 시크릿 미설정 — 백업 채널 스킵")
          PYEOF
