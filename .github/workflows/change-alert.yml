name: ?좉퇋쨌蹂寃?怨듦퀬 ?뚮┝

on:
  push:
    branches: [main]
    paths:
      - 'data/announcements.json'
  workflow_dispatch:
    inputs:
      reason:
        description: '諛쒖넚 ?ъ쑀 (cowork-collect / monthly-review / manual ??'
        required: false
        default: 'manual'

jobs:
  diff-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: ?덊룷 泥댄겕?꾩썐 (吏곸쟾 而ㅻ컠源뚯? 鍮꾧탳 媛?ν븯寃?
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 諛쒖넚 ?ъ쑀 異붿텧 (push ?대깽?몃㈃ commit message?먯꽌)
        id: reason
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MSG="${{ github.event.head_commit.message }}"
            if echo "$MSG" | grep -qE 'auto-sync \(.+\):'; then
              R=$(echo "$MSG" | sed -E 's/.*auto-sync \(([^)]+)\):.*/\1/' | head -1)
            else
              R="push"
            fi
          else
            R="${{ github.event.inputs.reason }}"
            [ -z "$R" ] && R="manual"
          fi
          echo "value=$R" >> $GITHUB_OUTPUT
          echo "  ??reason: $R"

      - name: announcements.json diff 異붿텧
        id: diff
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os

          # HEAD~1 ??announcements.json 異붿텧
          try:
              prev_raw = subprocess.check_output(
                  ["git", "show", "HEAD~1:data/announcements.json"],
                  stderr=subprocess.DEVNULL,
              )
              prev = json.loads(prev_raw)
          except Exception:
              prev = []

          with open("data/announcements.json", "r", encoding="utf-8") as f:
              cur = json.load(f)

          prev_by_id = {x.get("id"): x for x in prev}
          cur_by_id  = {x.get("id"): x for x in cur}

          # ?좉퇋 = ??ID
          new_items = [v for k, v in cur_by_id.items() if k not in prev_by_id]

          # 蹂寃?= 湲곗〈 ID?몃뜲 ?댁슜 諛붾?寃?          TRACK_FIELDS = [
              "title", "deadline", "deadlineDate", "closed",
              "budget", "relevance", "applyUrl", "note", "verified",
              "decision", "result",
          ]
          changed_items = []
          for k, cur_item in cur_by_id.items():
              if k not in prev_by_id:
                  continue
              prev_item = prev_by_id[k]
              diffs = []
              for field in TRACK_FIELDS:
                  if cur_item.get(field) != prev_item.get(field):
                      diffs.append({
                          "field": field,
                          "before": prev_item.get(field),
                          "after": cur_item.get(field),
                      })
              if diffs:
                  cur_item = dict(cur_item)
                  cur_item["_diffs"] = diffs
                  changed_items.append(cur_item)

          out = {"new": new_items, "changed": changed_items}
          with open("diff_result.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False)

          print(f"?좉퇋: {len(new_items)}嫄?/ 蹂寃? {len(changed_items)}嫄?)
          # GitHub Actions output
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"new_count={len(new_items)}\n")
              f.write(f"changed_count={len(changed_items)}\n")
          PYEOF

      - name: ?좉퇋쨌蹂寃??놁쑝硫?醫낅즺
        if: steps.diff.outputs.new_count == '0' && steps.diff.outputs.changed_count == '0'
        run: |
          echo "[?ㅽ궢] ?좉퇋쨌蹂寃?0嫄???諛쒖넚 ????
          exit 0

      - name: 硫붿씪 諛쒖넚
        if: steps.diff.outputs.new_count != '0' || steps.diff.outputs.changed_count != '0'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: "eyejw29@gmail.com"
          GMAIL_RECIPIENT: "sejong-8784@hanmail.net"
          GMAIL_CC: "eyejw29@gmail.com"
          DASHBOARD_URL: "https://eyejw29.github.io/sejong-gugak-dashboard/"
          REASON: ${{ steps.reason.outputs.value }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import json, smtplib, os, sys
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime, timezone, timedelta

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)
          today = now.strftime("%Y-%m-%d")
          weekday = ["??,"??,"??,"紐?,"湲?,"??,"??][now.weekday()]

          with open("diff_result.json", "r", encoding="utf-8") as f:
              diff = json.load(f)
          new_items = diff["new"]
          changed_items = diff["changed"]

          SENDER = os.environ["GMAIL_SENDER"]
          RECIPIENT = os.environ["GMAIL_RECIPIENT"]
          CC = os.environ.get("GMAIL_CC", "")
          APP_PW = os.environ["GMAIL_APP_PASSWORD"]
          DASHBOARD = os.environ["DASHBOARD_URL"]
          REASON = os.environ.get("REASON", "manual")

          def label(field):
              return {
                  "title": "?쒕ぉ", "deadline": "留덇컧(?쒖떆)", "deadlineDate": "留덇컧??,
                  "closed": "留덇컧?щ?", "budget": "?덉궛", "relevance": "愿?⑤룄",
                  "applyUrl": "?좎껌URL", "note": "鍮꾧퀬", "verified": "寃利?,
                  "decision": "?섏궗寃곗젙", "result": "寃곌낵",
              }.get(field, field)

          lines = [
              f"?렦 ?몄쥌援?븙 ???좉퇋쨌蹂寃?怨듦퀬 ?뚮┝",
              f"",
              f"{today} ({weekday}) 쨌 ?ъ쑀: {REASON}",
              f"?좉퇋 {len(new_items)}嫄?쨌 蹂寃?{len(changed_items)}嫄?,
              f"",
              f"{'?'*40}",
          ]

          if new_items:
              lines.append("")
              lines.append(f"?넅 ?좉퇋 怨듦퀬 ({len(new_items)}嫄?")
              for it in new_items:
                  lines.append("")
                  lines.append(f"??{it.get('title','(?쒕ぉ?놁쓬)')}")
                  lines.append(f"  ?룢 {it.get('org','')}  쨌  留덇컧: {it.get('deadline') or it.get('deadlineDate') or '?뺤씤?꾩슂'}")
                  if it.get('budget'):
                      lines.append(f"  ?뮥 {it['budget']}")
                  if it.get('relevance') == 'high':
                      lines.append(f"  狩??듭떖 留ㅼ묶 ?꾨낫")
                  if it.get('applyUrl'):
                      lines.append(f"  ?뱨 {it['applyUrl']}")
                  tag = "??寃利앹셿猷? if it.get('verified') else "?좑툘 誘멸?利?
                  lines.append(f"  {tag}")
                  if it.get('note'):
                      lines.append(f"  ?뮠 {it['note']}")

          if changed_items:
              lines.append("")
              lines.append(f"?륅툘 蹂寃쎈맂 怨듦퀬 ({len(changed_items)}嫄?")
              for it in changed_items:
                  lines.append("")
                  lines.append(f"??{it.get('title','(?쒕ぉ?놁쓬)')} (id={it.get('id')})")
                  for d in it.get("_diffs", []):
                      lines.append(f"  쨌 {label(d['field'])}: {d['before']!r} ??{d['after']!r}")
                  if it.get('applyUrl'):
                      lines.append(f"  ?뱨 {it['applyUrl']}")

          lines += [
              f"",
              f"{'?'*40}",
              f"",
              f"??쒕낫?? {DASHBOARD}",
              f"???좉퇋/蹂寃?諛쒖깮 ?쒖뿉留?諛쒖넚?⑸땲??",
          ]
          body = "\n".join(lines)

          parts = []
          if new_items: parts.append(f"?좉퇋 {len(new_items)}嫄?)
          if changed_items: parts.append(f"蹂寃?{len(changed_items)}嫄?)
          subject = f"[?몄쥌援?븙] {' + '.join(parts)} ??{today}"

          msg = MIMEMultipart("alternative")
          msg["Subject"] = subject
          msg["From"] = f"?몄쥌援?븙 怨듦퀬?뚮┝ <{SENDER}>"
          msg["To"] = RECIPIENT
          if CC:
              msg["Cc"] = CC
          msg.attach(MIMEText(body, "plain", "utf-8"))

          recipients = [RECIPIENT] + ([CC] if CC else [])
          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(SENDER, APP_PW)
              server.send_message(msg, to_addrs=recipients)
          print(f"[?깃났] ?좉퇋쨌蹂寃??뚮┝ 諛쒖넚 ??{recipients}")
          print(f"?쒕ぉ: {subject}")

          # ??? ?붾젅洹몃옩 諛깆뾽 諛쒖넚 ???
          tg_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          tg_chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if tg_token and tg_chat:
              import urllib.request, urllib.parse
              tg_msg = body[:3900]
              if len(body) > 3900:
                  tg_msg += "\n\n???앸왂, 硫붿씪?먯꽌 ?꾩껜 ?뺤씤)"
              try:
                  req = urllib.request.Request(
                      f"https://api.telegram.org/bot{tg_token}/sendMessage",
                      data=urllib.parse.urlencode({
                          "chat_id": tg_chat,
                          "text": tg_msg,
                          "disable_web_page_preview": "true",
                      }).encode("utf-8"),
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      print(f"[?깃났] ?붾젅洹몃옩 諛쒖넚 ?꾨즺 ({resp.status})")
              except Exception as e:
                  print(f"[寃쎄퀬] ?붾젅洹몃옩 諛쒖넚 ?ㅽ뙣 (硫붿씪? ?깃났): {e}")
          else:
              print("[?뺣낫] ?붾젅洹몃옩 ?쒗겕由?誘몄꽕????諛깆뾽 梨꾨꼸 ?ㅽ궢")
          PYEOF
