name: Auto-close expired announcements

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 09:00 KST (UTC 0:00)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-close expired announcements
        id: autoclose
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json, os
          from datetime import datetime

          today = datetime.now().strftime("%Y-%m-%d")
          print(f"[{today}] 마감 공고 자동 closed 처리 시작")

          with open("data/announcements.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          changed = []
          for item in data:
              if item.get("closed", False):
                  continue
              deadline = item.get("deadlineDate")
              if not deadline:
                  continue
              try:
                  if deadline < today:
                      item["closed"] = True
                      changed.append({
                          "id": item.get("id"),
                          "title": item.get("title", ""),
                          "deadline": deadline,
                      })
              except (ValueError, TypeError):
                  pass

          if changed:
              with open("data/announcements.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f"[OK] {len(changed)}건 closed 처리:")
              for c in changed:
                  print(f"  id={c['id']}: {c['title']} (마감: {c['deadline']})")
          else:
              print("[OK] 변경 없음 — 마감된 공고 없음")

          # GitHub Actions output (이후 step에서 활용)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed_count={len(changed)}\n")

          # 상세 리스트는 파일로 (변경 알림용)
          with open("autoclose_result.json", "w", encoding="utf-8") as f:
              json.dump({"date": today, "items": changed}, f, ensure_ascii=False, indent=2)
          PYTHON_SCRIPT

      - name: Commit announcement changes
        id: commit-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/announcements.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "변경 없음 — 스킵"
          else
            git add data/announcements.json
            git commit -m "자동: 마감 공고 closed 처리 ($(date +%Y-%m-%d))"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild dashboard (build.py)
        if: steps.commit-data.outputs.changed == 'true'
        run: |
          python3 scripts/build.py --data-dir data --template templates/dashboard.html --output index.html

      - name: Commit rebuilt dashboard
        if: steps.commit-data.outputs.changed == 'true'
        run: |
          git add index.html
          if ! git diff --cached --quiet index.html; then
            git commit -m "자동: 대시보드 리빌드 ($(date +%Y-%m-%d))"
            git push
          fi

      - name: Trigger change-alert (마감 처리된 항목 알림)
        if: steps.commit-data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run change-alert.yml -f reason=auto-close
