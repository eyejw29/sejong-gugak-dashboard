<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세종국악 공고알림 - 카카오 로그인</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .logo { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 22px; color: #333; margin-bottom: 8px; }
        .desc { font-size: 14px; color: #888; margin-bottom: 32px; line-height: 1.6; }
        .kakao-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FEE500;
            color: #191919;
            border: none;
            border-radius: 12px;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
        }
        .kakao-btn:hover { background: #F0D800; }
        .status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }
        .status.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .status.error { display: block; background: #fce4ec; color: #c62828; }
        .status.info { display: block; background: #e3f2fd; color: #1565c0; }
        .token-area {
            margin-top: 16px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 11px;
            word-break: break-all;
            text-align: left;
            display: none;
        }
        .note {
            margin-top: 24px;
            font-size: 12px;
            color: #aaa;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎵</div>
        <h1>세종국악 공고알림</h1>
        <p class="desc">
            카카오톡 친구 메시지 기능을 위해<br>
            아래 버튼을 눌러 로그인해 주세요.
        </p>
        <a class="kakao-btn" id="loginBtn" href="https://kauth.kakao.com/oauth/authorize?client_id=f7026d9b90f9ea6b04009770b6f75f00&redirect_uri=https://eyejw29.github.io/sejong-gugak-dashboard/login.html&response_type=code&scope=friends,talk_message">
            카카오 로그인
        </a>
        <div id="status" class="status"></div>
        <div id="tokenArea" class="token-area"></div>
        <p class="note">
            세종국악관현악단 공고알림 서비스의<br>
            카카오톡 메시지 발송을 위한 인증 페이지입니다.
        </p>
    </div>
    <script>
        function showStatus(type, message) {
            var el = document.getElementById('status');
            el.className = 'status ' + type;
            el.innerHTML = message;
        }
        (function() {
            var urlParams = new URLSearchParams(window.location.search);
            var code = urlParams.get('code');
            var error = urlParams.get('error');
            if (error) {
                showStatus('error', '로그인이 취소되었습니다. 다시 시도해 주세요.');
                return;
            }
            if (code) {
                document.getElementById('loginBtn').style.display = 'none';
                showStatus('info', '인가 코드를 받았습니다. 토큰 발급 중...');
                fetch('https://kauth.kakao.com/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code',
                        client_id: 'f7026d9b90f9ea6b04009770b6f75f00',
                        client_secret: 'EGRi0gePEY8LT8pxbTpk01DAD6uEJDG4',
                        redirect_uri: 'https://eyejw29.github.io/sejong-gugak-dashboard/login.html',
                        code: code
                    })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.access_token) {
                        showStatus('success', '✅ 로그인 성공!<br><br>카카오톡 친구 메시지 권한이 승인되었습니다.<br>이제 이 창을 닫으셔도 됩니다.');
                        var tokenArea = document.getElementById('tokenArea');
                        tokenArea.style.display = 'block';
                        tokenArea.innerHTML = '<strong>Access Token:</strong><br>' + data.access_token + '<br><br><strong>Scope:</strong><br>' + (data.scope || 'N/A');
                    } else {
                        showStatus('error', '토큰 발급 실패: ' + (data.error_description || JSON.stringify(data)));
                        document.getElementById('loginBtn').style.display = 'flex';
                    }
                })
                .catch(function(err) {
                    showStatus('error', '오류: ' + err.message);
                    document.getElementById('loginBtn').style.display = 'flex';
                });
            }
        })();
    </script>
</body>
</html>
